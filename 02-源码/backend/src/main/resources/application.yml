server:
  port: 8087
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: health-exam
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/new_035?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 文件存储根目录（相对后端运行目录，指向项目根 uploads）
app:
  upload-dir: ./uploads
  jwt-secret: healthexam-secret-key-for-jwt-hs256-signing-2026-orange
  jwt-expire-hours: 12

logging:
  level:
    root: warn
    com.example.healthexam: info
