<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>登录 · 康检通体检预约与报告领取</title>
<link rel="stylesheet" href="mock.css">
<style>
body{background:#EDF3F5;display:grid;place-items:center;min-height:100vh}
.wrap{width:980px;height:560px;display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(21,52,74,.18)}
.left{position:relative;background:linear-gradient(150deg,#15344A,#1E4A61 55%,#237A8B);color:#fff;padding:44px 42px;display:flex;flex-direction:column}
.left .logo{display:flex;align-items:center;gap:10px;font-size:15px}
.left .logo .d{width:22px;height:22px;border:2px solid #7FD4E3;border-radius:6px;display:grid;place-items:center;font-size:12px}
.left h1{font-size:28px;line-height:1.35;margin-top:auto;font-weight:600;letter-spacing:.5px}
.left p{color:#B6CFD9;font-size:13px;margin-top:12px;line-height:1.8}
.left .kv{display:flex;gap:28px;margin-top:28px}
.left .kv div{font-size:12px;color:#9FBCC8}
.left .kv b{display:block;font-size:20px;color:#fff;font-family:var(--mono);margin-bottom:2px}
/* 心跳线：体检主题装饰 */
.ecg{position:absolute;left:0;right:0;bottom:0;height:110px;opacity:.38}
.pulse{stroke:#7FD4E3;stroke-width:1.6;fill:none}
.right{padding:52px 56px;display:flex;flex-direction:column;justify-content:center}
.right h2{font-size:20px;color:var(--primary)}
.right .sub{font-size:12.5px;color:var(--text-3);margin:6px 0 26px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs span{padding:0 0 10px;font-size:14px;color:var(--text-2);cursor:pointer}
.tabs span.on{color:var(--secondary);font-weight:500;border-bottom:2px solid var(--secondary)}
.inp{height:40px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;padding:0 12px;margin-bottom:14px;font-size:13px;color:var(--text-3)}
.inp.on{border-color:var(--secondary);color:var(--text)}
.inp .r{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:20px}
.btn-login{height:42px;background:var(--primary);color:#fff;border:0;border-radius:6px;font-size:14px;letter-spacing:4px;cursor:pointer}
.hint{margin-top:18px;font-size:12px;color:var(--text-3);line-height:1.9;background:#F7FAFB;border:1px dashed var(--line);border-radius:6px;padding:10px 12px}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="logo"><span class="d">体</span> 康检通 · 体检中心业务平台</div>
    <h1>预约、到检、报告<br>一条线管到底</h1>
    <p>套餐展示 · 时段容量 · 个人与团检预约 · 线下缴费 · 到检执行 · 报告归档与领取</p>
    <div class="kv"><div><b>28</b>检查项目</div><div><b>16</b>体检套餐</div><div><b>4</b>角色分权</div></div>
    <svg class="ecg" viewBox="0 0 500 110" preserveAspectRatio="none"><path class="pulse" d="M0 78h120l14-3 10-38 12 66 14-42 10 17h86l16-3 10-30 12 54 13-34 12 13h181"/></svg>
  </div>
  <div class="right">
    <h2>登录工作台</h2>
    <div class="sub">请使用院方分配的账号登录</div>
    <div class="tabs"><span class="on">账号登录</span><span>扫码登录</span></div>
    <div class="inp on">admin</div>
    <div class="inp">请输入密码<span class="r">显示</span></div>
    <div class="row"><label><input type="checkbox" checked> 记住账号</label><a href="#">忘记密码？</a></div>
    <button class="btn-login" style="display:block;width:100%;height:42px;background:#15344A;color:#fff;border:0;border-radius:6px;font-size:14px;letter-spacing:4px;cursor:pointer">登 录</button>
    <div class="hint">演示账号　管理员 admin/admin123 · 前台 front01/123456<br>体检用户 user01/123456 · 企业联络员 ent01/123456</div>
  </div>
</div>
</body></html>
